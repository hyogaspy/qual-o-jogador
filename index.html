<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Futdle Elite</title>
    <style>
        :root { --green: #00d24d; --red: #ff4b4b; --blue: #0046c7; --bg: #040816; --card: #101a35; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #1c2c54; background: #101a35; color: white; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
        
        .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 8px; animation: fadeIn 0.5s ease; }
        .box { background: var(--card); padding: 15px 5px; border-radius: 5px; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; min-height: 50px; border: 1px solid #1c2c54; }
        
        .correct { background: var(--green) !important; color: black; }
        .wrong { background: var(--red) !important; }
        
        .header-row { font-size: 10px; color: #8a99b8; text-transform: uppercase; margin-bottom: 5px; border: none; background: none; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: var(--green)">FUTDLE ELITE</h1>
    <p id="status">Carregando craques...</p>

    <div id="ui" style="display:none;">
        <input type="text" id="busca" list="sugestoes" placeholder="Chute um jogador de elite..." oninput="checarInput()">
        <datalist id="sugestoes"></datalist>
        
        <div class="row header-row">
            <div>Jogador</div><div>País</div><div>Time</div><div>Posição</div><div>Idade</div><div>Nº</div>
        </div>
        <div id="resultados"></div>
    </div>
</div>

<script>
    let jogadores = [];
    let secreto = null;

    async function init() {
        try {
            const r = await fetch('jogadores.json');
            const d = await r.json();
            jogadores = d.PlayerData;
            secreto = jogadores[Math.floor(Math.random() * jogadores.length)];
            
            const dl = document.getElementById('sugestoes');
            jogadores.forEach(j => {
                let o = document.createElement('option');
                o.value = j.Nome;
                dl.appendChild(o);
            });

            document.getElementById('status').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
        } catch (e) { document.getElementById('status').innerText = "Erro ao carregar JSON"; }
    }

    function checarInput() {
        const val = document.getElementById('busca').value;
        const j = jogadores.find(p => p.Nome === val);
        if (j) {
            processar(j);
            document.getElementById('busca').value = "";
        }
    }

    function processar(chute) {
        if (document.getElementById('c-'+chute.ID)) return;
        const res = document.getElementById('resultados');
        const row = document.createElement('div');
        row.className = 'row';
        row.id = 'c-' + chute.ID;

        const compare = (campo, alvo) => chute[campo] === secreto[campo] ? 'correct' : 'wrong';
        const setaIdade = chute.Idade < secreto.Idade ? " ⬆️" : (chute.Idade > secreto.Idade ? " ⬇️" : "");
        const setaNum = chute.Numero < secreto.Numero ? " ⬆️" : (chute.Numero > secreto.Numero ? " ⬇️" : "");

        row.innerHTML = `
            <div class="box">${chute.Nome}</div>
            <div class="box ${compare('Nacionalidade')}">${chute.Nacionalidade}</div>
            <div class="box ${compare('Time')}">${chute.Time}</div>
            <div class="box ${compare('Posicao')}">${chute.Posicao}</div>
            <div class="box ${compare('Idade')}">${chute.Idade}${setaIdade}</div>
            <div class="box ${compare('Numero')}">${chute.Numero}${setaNum}</div>
        `;

        res.insertBefore(row, res.firstChild);
        if (chute.ID === secreto.ID) alert("GOLAÇO!");
    }

    window.onload = init;
</script>
</body>
</html>

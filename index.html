<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Futdle Elite - SoccerWiki</title>
    <style>
        :root { --green: #00d24d; --blue: #0046c7; --dark: #050a15; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 450px; margin: 0 auto; }
        .header { margin-bottom: 30px; }
        .logo { font-size: 2.5rem; font-weight: 900; color: var(--green); text-shadow: 0 0 15px rgba(0,210,77,0.3); }
        
        #status-box { background: #101a35; padding: 15px; border-radius: 12px; border: 1px solid #1c2c54; margin-bottom: 20px; }
        
        .search-area { display: none; margin-bottom: 20px; }
        input { 
            width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #1c2c54;
            background: #0a1126; color: white; font-size: 16px; box-sizing: border-box;
        }

        .player-card {
            background: #101a35; border-radius: 12px; padding: 12px; margin-bottom: 10px;
            display: flex; align-items: center; border-left: 5px solid #2a3b63;
            animation: fadeIn 0.3s ease;
        }
        .player-card.correct { border-left-color: var(--green); background: #0d2b21; }
        .player-img { width: 55px; height: 55px; border-radius: 10px; background: #1c2c54; margin-right: 15px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">FUTDLE</div>
        <p>Modo Elite (Base SoccerWiki)</p>
    </div>

    <div id="status-box">⏳ Carregando base de dados pesada...</div>

    <div class="search-area" id="ui">
        <input type="text" id="busca" list="sugestoes" placeholder="Digite o nome do craque..." oninput="processarBusca()">
        <datalist id="sugestoes"></datalist>
    </div>

    <div id="resultados"></div>
</div>

<script>
    const ARQUIVO = 'jogadores.json';
    let todosJogadores = [];
    let filtradosElite = [];
    let secreto = null;

    async function carregar() {
        try {
            const resp = await fetch(ARQUIVO);
            const data = await resp.json();
            todosJogadores = data.PlayerData;

            // FILTRO INTELIGENTE: Pegamos apenas jogadores que tenham imagem e 
            // limitamos a busca para os 1000 primeiros da lista (onde costumam estar os melhores)
            filtradosElite = todosJogadores.filter(j => j.ImageURL && j.ImageURL.includes('.png')).slice(0, 1000);

            // Sorteia o secreto entre os 200 primeiros da lista (a elite da elite)
            secreto = filtradosElite[Math.floor(Math.random() * 200)];

            document.getElementById('status-box').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
        } catch (e) {
            document.getElementById('status-box').innerHTML = "❌ Erro ao ler arquivo jogadores.json";
        }
    }

    // Função de busca que não trava o navegador
    function processarBusca() {
        const input = document.getElementById('busca');
        const valor = input.value.trim().toLowerCase();
        const datalist = document.getElementById('sugestoes');

        if (valor.length < 3) {
            datalist.innerHTML = "";
            return;
        }

        // Busca na base inteira, mas só mostra 8 sugestões (para ser rápido)
        const matches = todosJogadores
            .filter(j => (j.Forename + " " + j.Surname).toLowerCase().includes(valor))
            .slice(0, 8);

        datalist.innerHTML = matches.map(j => `<option value="${j.Forename} ${j.Surname}">`).join('');

        // Se o nome bater exatamente, chuta
        const exato = todosJogadores.find(j => (j.Forename + " " + j.Surname).toLowerCase() === valor);
        if (exato) {
            exibir(exato);
            input.value = "";
            datalist.innerHTML = "";
        }
    }

    function exibir(chute) {
        if (document.getElementById('p-' + chute.ID)) return;

        const lista = document.getElementById('resultados');
        const acertou = chute.ID === secreto.ID;
        const card = document.createElement('div');
        card.id = 'p-' + chute.ID;
        card.className = 'player-card' + (acertou ? ' correct' : '');
        
        card.innerHTML = `
            <img src="${chute.ImageURL}" class="player-img" onerror="this.src='https://via.placeholder.com/55?text=⚽'">
            <div style="flex-grow:1; text-align:left;">
                <span style="display:block; font-weight:bold">${chute.Forename} ${chute.Surname}</span>
                <span style="font-size:12px; color:#8a99b8">ID: ${chute.ID}</span>
            </div>
            <div style="font-size: 20px;">${acertou ? '🎯' : '❌'}</div>
        `;

        lista.insertBefore(card, lista.firstChild);
        if (acertou) alert("GOLAÇO! Você encontrou o jogador!");
    }

    window.onload = carregar;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futdle - SoccerWiki</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #121212; color: white; text-align: center; padding: 20px; 
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* Painel de Status */
        #status { 
            background: #222; padding: 10px; border-radius: 8px; 
            margin-bottom: 20px; font-size: 14px; color: #00ff41;
            border: 1px solid #333;
        }

        .search-area { margin-bottom: 30px; }
        input { 
            padding: 12px; width: 60%; border-radius: 5px; border: 1px solid #333; 
            background: #1a1a1a; color: white; outline: none;
        }
        button { 
            padding: 12px 20px; border-radius: 5px; background: #00ff41; 
            color: black; border: none; cursor: pointer; font-weight: bold; 
        }

        .player-card {
            background: #1e1e1e; padding: 15px; margin-top: 10px; border-radius: 10px;
            display: flex; align-items: center; justify-content: space-between;
            border-left: 5px solid #444; animation: slideIn 0.3s ease;
        }
        .correct { border-left-color: #00ff41; }
        .player-img { width: 50px; height: 50px; border-radius: 50%; background: #333; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>FUTDLE ⚽</h1>
    <div id="status">Carregando base de dados...</div>

    <div id="game-ui" style="display:none;" class="search-area">
        <input type="text" id="inputJogador" list="listaSugestoes" placeholder="Digite o nome do jogador...">
        <datalist id="listaSugestoes"></datalist>
        <button onclick="fazerPalpite()">Chutar</button>
    </div>

    <div id="listaResultados"></div>
</div>

<script>
    const ARQUIVO_JSON = 'jogadores.json'; // O nome que você deve colocar no seu arquivo
    let baseDeJogadores = [];
    let JOGADOR_SECRETO = null;

    // Função para buscar os dados
    async function carregarDados() {
        const statusDiv = document.getElementById('status');
        try {
            // No GitHub, o fetch funciona sem problemas de CORS
            const resposta = await fetch(ARQUIVO_JSON);
            
            if (!resposta.ok) throw new Error("Não foi possível carregar o arquivo " + ARQUIVO_JSON);
            
            const dados = await resposta.json();
            baseDeJogadores = dados.PlayerData;

            if (baseDeJogadores && baseDeJogadores.length > 0) {
                statusDiv.innerHTML = "✅ " + baseDeJogadores.length + " jogadores carregados!";
                inicializarJogo();
            } else {
                throw new Error("O JSON está vazio ou o formato está incorreto.");
            }
        } catch (erro) {
            statusDiv.innerHTML = "❌ Erro: " + erro.message;
            statusDiv.style.color = "#ff4444";
            console.error(erro);
        }
    }

    function inicializarJogo() {
        // Seleciona o jogador secreto aleatoriamente
        JOGADOR_SECRETO = baseDeJogadores[Math.floor(Math.random() * baseDeJogadores.length)];
        
        // Preenche o datalist para o autocomplete
        const datalist = document.getElementById('listaSugestoes');
        baseDeJogadores.forEach(j => {
            const nomeCompleto = (j.Forename + " " + j.Surname).trim();
            const option = document.createElement('option');
            option.value = nomeCompleto;
            datalist.appendChild(option);
        });

        // Mostra a interface
        document.getElementById('game-ui').style.display = 'block';
    }

    function fazerPalpite() {
        const input = document.getElementById('inputJogador');
        const nomeDigitado = input.value.trim().toLowerCase();
        
        // Procura o jogador na base
        const chute = baseDeJogadores.find(j => 
            (j.Forename + " " + j.Surname).toLowerCase() === nomeDigitado
        );

        if (!chute) {
            alert("Jogador não encontrado! Selecione um nome da lista.");
            return;
        }

        exibirResultado(chute);
        input.value = ""; // Limpa o campo
    }

    function exibirResultado(chute) {
        const container = document.getElementById('listaResultados');
        const acertou = (chute.ID === JOGADOR_SECRETO.ID);
        
        const card = document.createElement('div');
        card.className = 'player-card' + (acertou ? ' correct' : '');

    <style>
        body { font-family: 'Arial', sans-serif; background: #0a0a0a; color: white; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        input { padding: 12px; width: 250px; border-radius: 5px; border: 1px solid #333; background: #1a1a1a; color: white; }
        button { padding: 12px 20px; background: #00ff41; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        
        /* Grid das Categorias */
        .header-grid, .player-row { 
            display: grid; 
            grid-template-columns: 2fr 1fr 1fr 1.5fr 1fr 1fr; 
            gap: 8px; margin-top: 10px; 
        }
        
        .box { 
            background: #1e1e1e; padding: 15px 5px; border-radius: 4px; 
            font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center;
            border: 1px solid #333; min-height: 40px;
        }

        /* Cores de Comparação */
        .correct { background-color: #2e7d32 !important; border-color: #4caf50; }
        .wrong { background-color: #c62828 !important; border-color: #f44336; }
    </style>
</head>

    // DEFINIR O JOGADOR DO DIA (Neste exemplo, é o Vini Jr)
    const SECRETO = JOGADORES[0];

    // Preencher o datalist com os nomes para o usuário escolher
    const datalist = document.getElementById('listaJogadores');
    JOGADORES.forEach(j => {
        let opt = document.createElement('option');
        opt.value = j.nome;
        datalist.appendChild(opt);
    });

    function chutar() {
        const input = document.getElementById('inputJogador');
        const chute = JOGADORES.find(j => j.nome.toLowerCase() === input.value.toLowerCase());

        if (!chute) {
            alert("Jogador não encontrado na nossa lista!");
            return;
        }

        exibirNoGrid(chute);
        input.value = "";
    }

    function exibirNoGrid(chute) {
        const grid = document.getElementById('resultados');
        const row = document.createElement('div');
        row.className = 'player-row';

        // Lógica de cores
        const cNac = chute.nac === SECRETO.nac ? 'correct' : 'wrong';
        const cLiga = chute.liga === SECRETO.liga ? 'correct' : 'wrong';
        const cTime = chute.time === SECRETO.time ? 'correct' : 'wrong';
        const cPos = chute.pos === SECRETO.pos ? 'correct' : 'wrong';
        
        const cIdade = chute.idade === SECRETO.idade ? 'correct' : 'wrong';
        const seta = chute.idade < SECRETO.idade ? " ⬆️" : (chute.idade > SECRETO.idade ? " ⬇️" : "");

        row.innerHTML = `
            <div class="box">${chute.nome}</div>
            <div class="box ${cNac}">${chute.nac}</div>
            <div class="box ${cLiga}">${chute.liga}</div>
            <div class="box ${cTime}">${chute.time}</div>
            <div class="box ${cPos}">${chute.pos}</div>
            <div class="box ${cIdade}">${chute.idade}${seta}</div>
        `;

        grid.insertBefore(row, grid.firstChild);

        if (chute.nome === SECRETO.nome) {
            alert("GOLAÇO! Você acertou o jogador!");
        }
    }
